name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # `packages: ''` stops this action from installing its obsolete default package set, which is
      # what made the build fail here. We install exactly what we need in the next step.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android platform and build tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk CloudBridge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CloudBridge-apk
          path: CloudBridge.apk

      - name: Publish a release with the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-${{ github.run_number }}-${{ github.run_attempt }}" CloudBridge.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "CloudBridge build ${{ github.run_number }}.${{ github.run_attempt }}" \
            --notes "Download CloudBridge.apk to your Android phone and open it to install."
