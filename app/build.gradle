plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cloudbridge.app'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.cloudbridge.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        // Optional: a Google OAuth client baked into the app (set by the build from GOOGLE_CLIENT_ID and
        // GOOGLE_CLIENT_SECRET). When present, "Sign in with Google" needs no client ID typed in.
        buildConfigField 'String', 'GOOGLE_CLIENT_ID', '"' + (System.getenv('GOOGLE_CLIENT_ID') ?: '').trim().replace('"', '') + '"'
        buildConfigField 'String', 'GOOGLE_CLIENT_SECRET', '"' + (System.getenv('GOOGLE_CLIENT_SECRET') ?: '').trim().replace('"', '') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the auto-generated debug key so the APK installs directly (sideloading).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
